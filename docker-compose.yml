version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: sandeul_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1201"
      MYSQL_DATABASE: "member_db"
      # MYSQL_USER: "sandeul"
      # MYSQL_PASSWORD: "sandeul_pw"
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  web:
    build: .
    container_name: sandeul_web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: "1201"
      DB_NAME: "member_db"
    volumes:
      - ./src:/var/www/html
      - ./uploads:/var/www/html/uploads

volumes:
  db_data: